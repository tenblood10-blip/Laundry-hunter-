<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurir - Shaka Laundry</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:#111;padding:16px;color:#fff}
.card{background:#fff;color:#111;border-radius:16px;padding:16px;margin-bottom:12px}
.bank{border-radius:12px;padding:14px;text-align:center;margin:10px 0;color:#fff}
.bank b{font-size:26px;letter-spacing:1px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer}
.btn-lunas{background:#28a745;color:#fff} .btn-hapus{background:#eee}
img{width:100%;border-radius:10px;margin-top:8px}
.badge{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
</style>
</head>
<body>
<h2>🛵 Dashboard Kurir</h2>
<p style="opacity:.7">Shaka Laundry - Order Masuk</p>
<div id="list"></div>
<script>
function load(){
  let list=JSON.parse(localStorage.getItem('shaka_orders')||'[]');
  let el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div class=card>Belum ada orderan.</div>';return;}
  el.innerHTML=list.map((o,i)=>{
    let isTransfer = o.metodeBayar==='TRANSFER SEABANK';
    return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <b>${o.nama}</b>
      <span class="badge" style="background:${isTransfer?'#007bff':'#f59e0b'}">${isTransfer?'🏦 TRANSFER SEABANK':'💵 MANUAL / CASH'}</span>
    </div>
    <small>${o.tanggal}<br>${o.alamat}<br>WA: ${o.wa} | ${o.kg} kg | ${o.paket}</small>
    <h3>Total Tagih: Rp ${o.total.toLocaleString('id-ID')}</h3>
    <div class="bank" style="background:${isTransfer?'#111':'#f59e0b'}">
      ${isTransfer
        ? 'Transfer ke:<br>PT. BANK SEABANK INDONESIA<br><b>901195106698</b><br>a.n YHANUAR TRIWIBOWO<br><small>Pelanggan bisa bayar via DANA / OVO / GoPay / m-banking</small>'
        : '💵 TAGIH CASH KE PELANGGAN<br><b>Rp '+o.total.toLocaleString('id-ID')+'</b><br><small>Minta uang tunai, foto uang / kuitansi</small>'}
    </div>
    <p>${isTransfer ? '1. Minta pelanggan transfer ke SeaBank di atas<br>2. Minta liat bukti "Berhasil"<br>3. Foto bukti itu di sini:' : '1. Tagih cash ke pelanggan<br>2. Terima uang tunai<br>3. Foto uang / bukti di sini:'}</p>
    <input type="file" accept="image/*" capture="environment" onchange="preview(event,${i})" style="width:100%">
    <img src="${o.bukti||''}" style="display:${o.bukti?'block':'none'}">
    <button class="btn-lunas" onclick="lunas(${i})">✅ BUKTI UDAH DIFOTO, GAS JEMPUT</button>
    <button class="btn-hapus" onclick="hapus(${i})">Hapus Order</button>
    <div style="margin-top:8px;font-weight:700;color:${o.status.includes('LUNAS')?'green':'orange'}">Status: ${o.status} | Bayar via: ${o.metodeBayar}</div>
  </div>`}).join('');
}
function preview(e,i){
  let r=new FileReader(); r.onload=()=>{let list=JSON.parse(localStorage.getItem('shaka_orders')||'[]'); list[i].bukti=r.result; localStorage.setItem('shaka_orders',JSON.stringify(list)); load();}; r.readAsDataURL(e.target.files[0]);
}
function lunas(i){let list=JSON.parse(localStorage.getItem('shaka_orders')||'[]'); if(!list[i].bukti) return alert('Foto dulu bukti bayarnya!'); list[i].status='LUNAS - Baju Dijemput'; localStorage.setItem('shaka_orders',JSON.stringify(list)); load(); alert('Mantap! Order LUNAS.');}
function hapus(i){if(!confirm('Hapus order ini?'))return; let list=JSON.parse(localStorage.getItem('shaka_orders')||'[]'); list.splice(i,1); localStorage.setItem('shaka_orders',JSON.stringify(list)); load();}
load();
</script>
</body>
</html>
